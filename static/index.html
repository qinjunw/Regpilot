<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RegPilot</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><img src="/static/assets/regpilot-logo.png" alt=""></div>
      <h1>RegPilot</h1>
      <div class="status-strip" aria-label="运行状态">
        <span class="status-pill" id="local-status">本地运行</span>
        <button class="status-pill status-button muted portfolio-hidden" id="chrome-status" type="button" aria-label="检测或打开填报chrome">未检测到填报chrome</button>
        <span class="status-pill muted" id="tool-readiness-status">证据链就绪状态</span>
        <span class="status-pill portfolio-hidden" id="automation-policy">自动推进：停在提交前</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="status-toggle" type="button" aria-label="状态详情">☷</button>
        <button class="icon-button" id="settings-toggle" type="button" aria-label="设置">⚙</button>
      </div>
    </header>

    <div class="top-drawers">
      <section class="settings-panel hidden" id="settings-panel" aria-label="模型设置">
        <div>
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="">未配置</option>
            <option value="deepseek">DeepSeekPro</option>
            <option value="openai_compatible">OpenAI-compatible</option>
          </select>
        </div>
        <div>
          <label for="base-url">Base URL</label>
          <input id="base-url" autocomplete="off">
        </div>
        <div>
          <label for="model">Model</label>
          <input id="model" autocomplete="off">
        </div>
        <div>
          <label for="api-key">API Key</label>
          <input id="api-key" type="password" autocomplete="off" placeholder="留空则不更新密钥">
        </div>
        <div>
          <label for="request-timeout">Timeout(s)</label>
          <input id="request-timeout" type="number" min="30" max="1200" step="30" autocomplete="off">
        </div>
        <div>
          <label for="deepseek-thinking">DeepSeek Thinking</label>
          <select id="deepseek-thinking">
            <option value="enabled">enabled</option>
            <option value="disabled">disabled</option>
          </select>
        </div>
        <div>
          <label for="deepseek-reasoning-effort">Reasoning Effort</label>
          <select id="deepseek-reasoning-effort">
            <option value="high">high</option>
            <option value="max">max</option>
          </select>
        </div>
        <div>
          <label for="deepseek-max-tokens">Max Tokens</label>
          <input id="deepseek-max-tokens" type="number" min="1" step="1024" autocomplete="off" placeholder="默认">
        </div>
        <div>
          <label for="deepseek-user-id">DeepSeek user_id</label>
          <input id="deepseek-user-id" autocomplete="off" spellcheck="false" maxlength="512" pattern="[A-Za-z0-9_-]*" title="仅允许字母、数字、下划线和连字符，最多 512 个字符。" placeholder="非隐私隔离 ID">
        </div>
        <label class="checkbox-field" for="deepseek-stream-include-usage">
          <input id="deepseek-stream-include-usage" type="checkbox">
          <span>stream usage/cache</span>
        </label>
        <label class="checkbox-field" for="deepseek-strict-tool-schema">
          <input id="deepseek-strict-tool-schema" type="checkbox">
          <span>strict tool schema</span>
        </label>
        <div>
          <label for="deepseek-retry-max-attempts">Retry Attempts</label>
          <input id="deepseek-retry-max-attempts" type="number" min="1" max="8" step="1" autocomplete="off">
        </div>
        <div>
          <label for="deepseek-retry-backoff-seconds">Retry Backoff(s)</label>
          <input id="deepseek-retry-backoff-seconds" type="number" min="0" max="10" step="0.25" autocomplete="off">
        </div>
        <div>
          <label for="deepseek-json-empty-retry-attempts">JSON Empty Retry</label>
          <input id="deepseek-json-empty-retry-attempts" type="number" min="0" max="5" step="1" autocomplete="off">
        </div>
        <button class="primary-button" id="save-settings" type="button">保存设置</button>
        <div class="settings-note" id="settings-note"></div>
      </section>

      <section class="runtime-panel hidden" id="runtime-panel" aria-label="运行状态详情">
        <details class="side-panel collapsible-panel" id="task-context-panel">
          <summary class="panel-title">
            <h2>任务上下文摘要</h2>
            <span class="mini-badge" id="context-status">待接入</span>
          </summary>
          <dl class="kv-list" id="task-context"></dl>
        </details>

        <details class="side-panel collapsible-panel" id="execution-status-panel">
          <summary class="panel-title"><h2>自动执行状态</h2></summary>
          <dl class="kv-list" id="execution-status"></dl>
        </details>
      </section>
    </div>

    <div class="workspace-grid">
      <aside class="session-sidebar" aria-label="会话管理">
        <div class="session-header">
          <h2>会话</h2>
          <div class="session-controls">
            <button class="session-filter" id="toggle-archived" type="button" aria-label="切换归档会话">归档箱</button>
            <button class="session-add" id="new-session" type="button" aria-label="新增会话">+</button>
          </div>
        </div>
        <div class="session-list" id="session-list"></div>
        <div class="session-note" id="session-note">新建或选择一个会话开始。</div>
      </aside>

      <section class="chat-plane" aria-label="聊天工作台">
        <div class="chat-scroll" id="chat-log"></div>
        <form class="composer" id="composer">
          <button class="attach-button portfolio-hidden" type="button" aria-label="添加文件">＋</button>
          <textarea id="message-input" placeholder="输入你的问题或指令（Enter 发送，Shift+Enter 换行）" rows="2" autocomplete="off"></textarea>
          <button class="send-button" type="submit" aria-label="发送">➤</button>
        </form>
      </section>

      <aside class="side-stack" aria-label="任务状态">
        <section class="side-panel portfolio-hidden">
          <div class="panel-title"><h2>填报结果</h2></div>
          <div class="traffic-table" id="review-summary"></div>
        </section>

        <section class="side-panel review-panel" hidden>
          <div class="panel-title"><h2>待复核摘要</h2></div>
          <div class="review-note" id="review-note">等待底层验证结果接入。</div>
        </section>

        <section class="side-panel skills-panel" id="skills-panel">
          <div class="panel-title"><h2>Skills</h2></div>
          <div class="tool-cloud" id="tool-cloud"></div>
        </section>

        <section class="side-panel checklist-panel portfolio-hidden" id="checklist-panel">
          <div class="panel-title"><h2>Checklist</h2></div>
          <div class="checklist-table" id="checklist-table" role="table" aria-label="法规参数对照清单">
            <div class="checklist-row checklist-head" role="row">
              <strong role="columnheader">参数</strong>
              <strong role="columnheader">当前值</strong>
              <strong role="columnheader">标准值</strong>
            </div>
          </div>
        </section>

        <section class="side-panel budget-panel hidden">
          <div>
            <h2>人工介入预算</h2>
            <p id="human-budget">等待任务开始。</p>
          </div>
          <div class="budget-ring"><span id="pending-actions">0</span><small>待人工</small></div>
        </section>
      </aside>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
